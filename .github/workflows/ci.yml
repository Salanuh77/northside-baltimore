name: Northside CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Compile, run unit and map checks, and build the candidate
        run: ./scripts/ci.ps1
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: github.event_name == 'push'
        with:
          name: northside-place
          path: |
            Northside Baltimore - Heritage Harbor.rbxl
            release-hash.json
          if-no-files-found: error
